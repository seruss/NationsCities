name: Deploy

on:
  push:
    branches: [main]

env:
  PUBLISH_DIR: publish
  SERVICE_NAME: nationscities

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NationsCities.sln

      - name: Publish web
        run: >
          dotnet publish NationsCities.csproj
          -c Release -r linux-x64 --self-contained false
          -o ${{ env.PUBLISH_DIR }}

      - name: Package release
        run: tar czf release.tar.gz -C ${{ env.PUBLISH_DIR }} .

      - name: Verify deploy secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.DEPLOY_HOST }}" ] && missing+=(DEPLOY_HOST)
          [ -z "${{ secrets.DEPLOY_USER }}" ] && missing+=(DEPLOY_USER)
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] && missing+=(DEPLOY_SSH_KEY)
          [ -z "${{ secrets.DEPLOY_PORT }}" ] && missing+=(DEPLOY_PORT)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}."
            exit 1
          fi

      - name: Upload release artifact + deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # sshd nie stoi na 22 - port jest w sekrecie DEPLOY_PORT.
          port: ${{ secrets.DEPLOY_PORT }}
          source: "release.tar.gz,deploy/deploy.sh"
          target: "~/incoming"
          strip_components: 0

      - name: Run remote deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # sshd nie stoi na 22 - port jest w sekrecie DEPLOY_PORT.
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            chmod +x ~/incoming/deploy/deploy.sh
            ~/incoming/deploy/deploy.sh "${{ env.SERVICE_NAME }}" "${{ github.sha }}" ~/incoming/release.tar.gz
